
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHS AI</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #0b1020;
  color: white;
  font-family: Arial, sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  height: 65px;
  background: #141d32;
  display: flex;
  align-items: center;
  padding: 12px 18px;
  gap: 12px;
  border-bottom: 1px solid #293653;
}

header img {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  object-fit: cover;
}

header h2 {
  font-size: 21px;
}

main {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.welcome {
  text-align: center;
  margin: 65px auto 30px;
}

.welcome img {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  object-fit: cover;
}

.welcome h1 {
  margin: 18px 0;
  color: #8c9eff;
}

.welcome p {
  color: #aab5ce;
}

#messages {
  max-width: 750px;
  margin: auto;
}

.message {
  padding: 13px 16px;
  margin: 12px auto;
  border-radius: 12px;
  max-width: 90%;
  line-height: 1.6;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.user {
  background: #293e68;
  margin-left: auto;
}

.ai {
  background: #192641;
  margin-right: auto;
}

footer {
  padding: 15px;
  background: #111a2d;
}

.input {
  max-width: 750px;
  margin: auto;
  display: flex;
  gap: 8px;
}

textarea {
  flex: 1;
  resize: none;
  height: 48px;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #394968;
  background: #1a2740;
  color: white;
  font-size: 15px;
  outline: none;
}

button {
  border: 0;
  background: #627bff;
  color: white;
  border-radius: 12px;
  padding: 0 18px;
  font-size: 20px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
}

small {
  display: block;
  text-align: center;
  color: #7785a2;
  margin-top: 10px;
}
</style>
</head>

<body>

<header>
  <img src="logo.png" alt="GHS AI Logo">
  <h2>GHS AI</h2>
</header>

<main id="chat">

  <div class="welcome" id="welcome">
    <img src="logo.png" alt="GHS AI">
    <h1>Welcome to GHS AI</h1>
    <p>Your smart AI assistant. Ask me anything.</p>
  </div>

  <div id="messages"></div>

</main>

<footer>
  <div class="input">
    <textarea
      id="input"
      placeholder="Message GHS AI..."
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"
    ></textarea>

    <button id="sendBtn" onclick="send()">➤</button>
  </div>

  <small>GHS AI can make mistakes. Check important information.</small>
</footer>

<script>
const API_URL = "https://ghs-ai-x6jc.onrender.com/chat";

async function send() {
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");
  const text = input.value.trim();

  if (!text || sendBtn.disabled) return;

  document.getElementById("welcome").style.display = "none";

  const messages = document.getElementById("messages");

  const user = document.createElement("div");
  user.className = "message user";
  user.textContent = text;
  messages.appendChild(user);

  input.value = "";
  sendBtn.disabled = true;

  const reply = document.createElement("div");
  reply.className = "message ai";
  reply.textContent = "GHS AI উত্তর তৈরি করছে...";
  messages.appendChild(reply);

  document.getElementById("chat").scrollTop =
    document.getElementById("chat").scrollHeight;

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text
      })
    });

    if (!response.ok) {
      throw new Error("Server error: " + response.status);
    }

    const data = await response.json();

    if (!data.reply) {
      throw new Error("AI response পাওয়া যায়নি");
    }

    reply.textContent = data.reply;

  } catch (error) {
    reply.textContent =
      "দুঃখিত! GHS AI-এর সঙ্গে সংযোগ করা যাচ্ছে না। একটু পরে আবার চেষ্টা করুন।";

    console.error(error);

  } finally {
    sendBtn.disabled = false;
    input.focus();

    document.getElementById("chat").scrollTop =
      document.getElementById("chat").scrollHeight;
  }
}
</script>

</body>
</html>
